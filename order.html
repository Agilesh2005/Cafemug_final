<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Order Online | Cafemug Kitchen</title>
<meta name="robots" content="noindex,follow">
<link rel="icon" type="image/png" href="Logo/favicon.png">
<style>
:root{--maroon-deep:#2D0B0D;--maroon:#4A1517;--gold:#E5A91A;--gold-soft:#F5D076;--cream:#FCF8F2}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--maroon-deep);overscroll-behavior:none}
body{font-family:Inter,system-ui,sans-serif;display:flex;flex-direction:column;color:var(--cream)}
header{flex-shrink:0;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:10px 16px;background:var(--maroon-deep);border-bottom:1px solid rgba(245,183,32,.15);min-height:130px}
header .logo{grid-column:2;display:flex;align-items:center;gap:10px;justify-content:center}
header .logo img{height:110px;width:auto;border-radius:4px}
.fallback-link{grid-column:1;justify-self:start;font-size:11.5px;color:rgba(253,251,247,.55);text-decoration:underline;text-decoration-color:rgba(245,183,32,.35);white-space:nowrap}
.fallback-link:hover{color:var(--gold-soft)}
.close-btn{grid-column:3;justify-self:end;width:38px;height:38px;border-radius:50%;background:#1f0708;border:1px solid rgba(245,183,32,.35);color:var(--gold-soft);font-size:19px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;text-decoration:none;transition:background .2s ease,color .2s ease}
.close-btn:hover{background:var(--gold);color:var(--maroon-deep)}
@media (max-width:480px){.fallback-link{display:none}header .logo img{height:78px}header{min-height:100px}}
main{position:relative;flex:1;min-height:0}
iframe{width:100%;height:100%;border:none;background:#fff;overscroll-behavior:none}
.loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--maroon-deep);transition:opacity .3s ease}
.loading.hidden{opacity:0;pointer-events:none}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid rgba(245,183,32,.2);border-top-color:var(--gold);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading p{font-size:13px;color:rgba(253,251,247,.6)}
</style>
</head>
<body>
<header>
<a class="fallback-link" id="fallbackLink" href="#" target="_blank" rel="noopener">Trouble loading? Open in new tab</a>
<div class="logo"><img src="Logo/eng.jpeg" alt="Cafemug Kitchen"></div>
<a class="close-btn" id="closeBtn" href="index.html" aria-label="Close and return to Cafemug Kitchen">✕</a>
</header>
<main>
<div class="loading" id="loading"><div class="spinner"></div><p>Loading delivery menu…</p></div>
<iframe id="orderFrame" src="" title="Cafemug Delivery Ordering" allow="payment" referrerpolicy="no-referrer" sandbox="allow-scripts allow-forms allow-same-origin allow-popups allow-modals"></iframe>
</main>
<script>
const DEFAULT_ORDER_URL = "https://public.positeasy.in/?merchantId=cede3e6b-2ef1-4b55-91cd-bfc2476dbc21&storeId=Store1s&tableId=f2d383a6-53cc-425b-a0a3-7f18b4fb656e";
const params = new URLSearchParams(location.search);
const orderUrl = params.get("u") ? decodeURIComponent(params.get("u")) : DEFAULT_ORDER_URL;
const frame = document.getElementById("orderFrame");
const loading = document.getElementById("loading");
const fallback = document.getElementById("fallbackLink");
fallback.href = orderUrl;
frame.src = orderUrl;
frame.addEventListener("load", () => loading.classList.add("hidden"));
const GUARD_HASH = "#guard";
function armBackGuard() {
  history.pushState({ orderPage: true }, "", location.pathname + location.search + GUARD_HASH);
}
armBackGuard();
window.addEventListener("popstate", () => {
  // Re-arm immediately so rapid/repeated back actions can't slip past it.
  armBackGuard();
  location.href = "index.html";
});
</script>
</body>
</html>
